# Nombre de la aplicación
spring.application.name=recursos_humanos

# ===============================
# CONFIGURACIÓN DE MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/recursos_humanos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#createDatabaseIfNotExist=true
#Si la base de datos NO existe, MySQL la crea
#NO crea tablas, solo la BD
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACIÓN JPA / HIBERNATE
# ===============================
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# PUERTO DEL SERVIDOR
# ===============================
#server.port=8080

# ===============================
# CONFIGURACIÓN DE LOGGING
# ===============================
logging.level.root=INFO
logging.pattern.console=[%thread] %-5level %logger - %msg%n
# ===============================
# DESACTIVAR BANNER DE SPRING BOOT
# ===============================
spring.main.banner-mode=off

